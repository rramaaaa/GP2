<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>كاشف الأخبار المزيفة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:        #f0f2f8;
  --bg2:       #ffffff;
  --bg3:       #e8eaf2;
  --bg4:       #dde0ee;
  --border:    rgba(0,0,0,.09);
  --border2:   rgba(0,0,0,.16);
  --cyan:      #0078d4;
  --cyan-dim:  rgba(0,120,212,.1);
  --green:     #00875a;
  --green-dim: rgba(0,135,90,.1);
  --red:       #d93025;
  --red-dim:   rgba(217,48,37,.1);
  --amber:     #e08700;
  --amber-dim: rgba(224,135,0,.1);
  --t1: #1a1d2e;
  --t2: #4a5070;
  --t3: #8890b0;
  --r:  16px;
  --r2: 10px;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans Arabic', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);min-height:100vh;direction:rtl;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 60% 50% at 80% 0%,rgba(0,120,212,.06) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 10% 90%,rgba(0,135,90,.05) 0%,transparent 70%);}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:68px;border-bottom:1px solid var(--border);background:rgba(240,242,248,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.nav-left{display:flex;align-items:center;gap:10px}
.just-brand{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:9px;background:rgba(255,255,255,.7);border:1px solid var(--border);text-decoration:none}
.just-logo{width:38px;height:38px;object-fit:contain;display:block}
.just-text{display:flex;flex-direction:column;line-height:1.2}
.just-name-ar{font-size:.65rem;font-weight:700;color:#003f7d;letter-spacing:.01em}
.just-name-en{font-size:.55rem;font-weight:500;color:#555e7a;letter-spacing:.02em}
.nav-divider{width:1px;height:28px;background:var(--border);margin:0 4px}
.nav-icon{width:34px;height:34px;border-radius:9px;background:var(--cyan-dim);border:1px solid rgba(0,120,212,.25);display:flex;align-items:center;justify-content:center}
.nav-icon svg{stroke:var(--cyan)}
.nav-title{font-size:.88rem;font-weight:600;color:var(--t1);letter-spacing:-.01em}
.nav-right{display:flex;align-items:center;gap:8px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2.5s ease infinite}
.main{max-width:960px;margin:0 auto;padding:64px 32px 100px}
.heading{text-align:center;margin-bottom:52px;animation:up .5s ease both}
.heading h1{font-size:clamp(2rem,4.5vw,3rem);font-weight:700;letter-spacing:-.03em;margin-bottom:12px;color:var(--t1)}
.heading h1 em{font-style:normal;color:var(--cyan)}
.heading p{font-size:.95rem;color:var(--t2);line-height:1.8}
.just-badge{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 16px;border-radius:100px;background:rgba(0,63,125,.07);border:1px solid rgba(0,63,125,.18);font-size:.72rem;color:#003f7d;font-weight:500;letter-spacing:.01em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;animation:up .5s ease .08s both}
.tab{padding:16px 22px;border-radius:var(--r2);background:var(--bg2);border:1px solid var(--border);color:var(--t2);font-family:var(--sans);font-size:.95rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab svg{opacity:.5;transition:opacity .18s}
.tab.active{background:var(--cyan-dim);border-color:rgba(0,120,212,.35);color:var(--cyan);box-shadow:0 0 0 3px rgba(0,120,212,.08)}
.tab.active svg{opacity:1;stroke:var(--cyan)}
.icard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:36px;animation:up .5s ease .14s both;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.inp-sec{display:none}
.inp-sec.show{display:block}
textarea.field,input.field{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;color:var(--t1);font-family:var(--sans);font-size:1rem;outline:none;resize:none;transition:border-color .18s,box-shadow .18s;direction:rtl}
textarea.field{height:190px;line-height:1.8}
input.field{height:58px;font-family:var(--mono);font-size:.85rem;direction:ltr;text-align:left}
textarea.field::placeholder,input.field::placeholder{color:var(--t3)}
textarea.field:focus,input.field:focus{border-color:rgba(0,120,212,.4);box-shadow:0 0 0 3px rgba(0,120,212,.08);background:#fff}
.meta-row{display:flex;justify-content:space-between;margin:8px 0 18px}
.wc-lbl{font-family:var(--mono);font-size:.67rem;color:var(--t3)}
.err{display:none;align-items:center;gap:8px;background:rgba(217,48,37,.07);border:1px solid rgba(217,48,37,.25);border-radius:var(--r2);padding:11px 15px;color:#d93025;font-size:.8rem;margin-bottom:14px}
.err.show{display:flex}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{height:58px;border-radius:var(--r2);border:1px solid;font-family:var(--sans);font-size:.98rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .18s ease}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none !important}
.btn-a{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn-a:hover:not(:disabled){background:#006abf;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,120,212,.25)}
.btn-b{background:var(--bg3);border-color:var(--border2);color:var(--t2)}
.btn-b:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.loader{display:none;align-items:center;justify-content:center;gap:10px;padding-top:16px}
.loader.show{display:flex}
.spin{width:18px;height:18px;border:2px solid var(--bg4);border-top-color:var(--cyan);border-radius:50%;animation:spin .65s linear infinite}
.loader-txt{font-family:var(--mono);font-size:.7rem;color:var(--t3)}
.progbar{height:2px;background:var(--bg3);border-radius:2px;overflow:hidden;display:none;margin-top:14px}
.progbar.show{display:block}
.progbar-fill{height:100%;width:28%;background:var(--cyan);animation:slide 1.1s ease infinite}
.results{display:none;flex-direction:column;gap:16px;margin-top:24px;animation:up .45s ease both;max-width:960px}
.results.show{display:flex}
.new-btn{align-self:flex-start;background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--t2);font-family:var(--sans);font-size:.77rem;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .18s;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.new-btn:hover{color:var(--t1);border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.rcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;position:relative;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.rcard-glow{position:absolute;top:0;left:0;right:0;height:3px}
.rcard.real .rcard-glow{background:linear-gradient(90deg,transparent,var(--green),transparent)}
.rcard.fake .rcard-glow{background:linear-gradient(90deg,transparent,var(--red),transparent)}
/* ── BIGGER ring card body ── */
.rcard-body{padding:36px;display:flex;align-items:center;gap:36px}
.ring-wrap{flex-shrink:0;position:relative;width:170px;height:170px}
.ring-wrap svg{width:170px;height:170px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:10}
.ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)}
.rcard.real .ring-fill{stroke:var(--green)}
.rcard.fake .ring-fill{stroke:var(--red)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-family:var(--mono);font-size:2.1rem;font-weight:600;line-height:1}
.ring-lbl{font-size:.62rem;color:var(--t3);font-family:var(--mono);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.rcard.real .ring-pct{color:var(--green)}
.rcard.fake .ring-pct{color:var(--red)}
.verdict-info{flex:1}
.verdict-tag{display:inline-flex;align-items:center;gap:6px;font-size:.67rem;font-family:var(--mono);letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:100px;border:1px solid;margin-bottom:12px}
.rcard.real .verdict-tag{color:var(--green);border-color:rgba(0,135,90,.35);background:var(--green-dim)}
.rcard.fake .verdict-tag{color:var(--red);border-color:rgba(217,48,37,.35);background:var(--red-dim)}
.verdict-main{font-size:1.65rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.rcard.real .verdict-main{color:var(--green)}
.rcard.fake .verdict-main{color:var(--red)}
.verdict-sub{font-size:.82rem;color:var(--t2);line-height:1.6}
/* ── BIGGER mini rings ── */
.mini-rings{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.mini-ring-item{display:flex;flex-direction:column;align-items:center;gap:12px}
.mini-ring-wrap{position:relative;width:110px;height:110px}
.mini-ring-wrap svg{width:110px;height:110px;transform:rotate(-90deg)}
.mini-ring-bg{fill:none;stroke:var(--bg3);stroke-width:8}
.mini-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)}
.mini-ring-fill.g{stroke:var(--green)}
.mini-ring-fill.r{stroke:var(--red)}
.mini-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mini-pct{font-family:var(--mono);font-size:1.2rem;font-weight:600}
.mini-pct.g{color:var(--green)}
.mini-pct.r{color:var(--red)}
.mini-label{font-size:.7rem;color:var(--t2);font-weight:500;text-align:center}
.mini-code{font-size:.62rem;font-family:var(--mono);letter-spacing:.5px;text-align:center;margin-top:2px}
.mini-code.g{color:var(--green)}
.mini-code.r{color:var(--red)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px 16px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.stat-lbl{font-family:var(--mono);font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px}
.stat-val{font-family:var(--mono);font-size:1.35rem;font-weight:500;color:var(--t1)}
.danger-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:22px 26px;display:flex;align-items:center;gap:24px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.danger-label-wrap{flex-shrink:0}
.danger-key{font-family:var(--mono);font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.danger-val{font-size:.95rem;font-weight:600;color:var(--t1)}
.danger-arc{flex:1;display:flex;justify-content:center}
.explain-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:24px 26px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.sec-label{font-family:var(--mono);font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.explain-txt{font-size:.86rem;color:var(--t2);line-height:1.9;border-right:2px solid var(--bg4);padding-right:16px}
@keyframes up   {from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin {to{transform:rotate(360deg)}}
@keyframes slide{from{transform:translateX(-200%)}to{transform:translateX(500%)}}
@media(max-width:580px){
  .nav{padding:0 12px;height:auto;flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}
  .just-brand{padding:5px 8px}
  .just-name-en{display:none}
  .nav-divider{display:none}
  .main{padding:32px 14px 70px}
  .rcard-body{flex-direction:column;align-items:flex-start;gap:22px}
  .ring-wrap{width:140px;height:140px}
  .ring-wrap svg{width:140px;height:140px}
  .btns{grid-template-columns:1fr}
  .mini-ring-wrap{width:88px;height:88px}
  .mini-ring-wrap svg{width:88px;height:88px}
  .stats-row{grid-template-columns:1fr 1fr}
}
/* ── CONTACT FOOTER ── */
.contact-footer{background:var(--bg2);border-top:1px solid var(--border);padding:20px 32px}
.contact-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.contact-inner svg{stroke:var(--t3);flex-shrink:0}
.contact-label{font-size:.8rem;color:var(--t3);font-family:var(--mono);letter-spacing:.02em}
.contact-dot{color:var(--t3);font-size:.8rem}
.contact-email{font-size:.8rem;font-family:var(--mono);color:var(--cyan);text-decoration:none;letter-spacing:.02em;transition:color .18s}
.contact-email:hover{color:#005fa3;text-decoration:underline}
</style>
</head>

    <span class="nav-title">كاشف الأخبار المزيفة</span>
  </div>
  <div class="nav-right">
    <div class="pulse"></div>
  </div>
</nav>

<main class="main">
  <div class="heading">
    <h1>تحقق من <em>مصداقية</em> الخبر</h1>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabTxt" onclick="pick('text')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      إدخال نص
    </button>
    <button class="tab" id="tabUrl" onclick="pick('url')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      إدخال رابط
    </button>
  </div>

  <div class="icard">
    <div class="inp-sec show" id="secTxt">
      <textarea class="field" id="txtIn" placeholder="الصق نص الخبر هنا للتحقق من صحته... (5 كلمات على الأقل)" oninput="wc()"></textarea>
      <div class="meta-row"><span class="wc-lbl" id="wcMeta">0 كلمة</span></div>
      <div class="err" id="errTxt">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errTxtMsg"></span>
      </div>
    </div>
    <div class="inp-sec" id="secUrl">
      <input class="field" id="urlIn" type="url" placeholder="https://example.com/article..."/>
      <div class="meta-row"><span></span></div>
      <div class="err" id="errUrl">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errUrlMsg"></span>
      </div>
    </div>

    <div class="btns">
      <button class="btn btn-a" onclick="run('detail')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        تحليل تفصيلي
      </button>
      <button class="btn btn-b" onclick="run('quick')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        تحليل سريع
      </button>
    </div>

    <div class="loader" id="loader">
      <div class="spin"></div>
      <span class="loader-txt">جاري التحليل ...</span>
    </div>
    <div class="progbar" id="progbar"><div class="progbar-fill"></div></div>
  </div>

  <div class="results" id="results">
    <button class="new-btn" onclick="doReset()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      تحليل جديد
    </button>

    <div class="rcard" id="rcard">
      <div class="rcard-glow"></div>
      <div class="rcard-body">
        <div class="ring-wrap">
          <!-- r=72 → circumference = 2π×72 ≈ 452.4 -->
          <svg viewBox="0 0 170 170" xmlns="http://www.w3.org/2000/svg">
            <circle class="ring-bg"   cx="85" cy="85" r="72"/>
            <circle class="ring-fill" cx="85" cy="85" r="72" id="ringFill"
              stroke-dasharray="452.4" stroke-dashoffset="452.4"/>
          </svg>
          <div class="ring-center">
            <span class="ring-pct" id="ringPct">—</span>
            <span class="ring-lbl">ثقة</span>
          </div>
        </div>
        <div class="verdict-info">
          <div class="verdict-tag"  id="verdictTag"></div>
          <div class="verdict-main" id="verdictMain"></div>
          <div class="verdict-sub"  id="verdictSub"></div>
        </div>
      </div>
    </div>

    <div id="detWrap" style="display:none;flex-direction:column;gap:16px">
      <!-- Mini rings: r=44 → circumference = 2π×44 ≈ 276.5 -->
      <div class="mini-rings">
        <div class="mini-ring-item">
          <div class="mini-ring-wrap">
            <svg viewBox="0 0 110 110"><circle class="mini-ring-bg" cx="55" cy="55" r="44"/><circle class="mini-ring-fill g" cx="55" cy="55" r="44" id="mfReal" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
            <div class="mini-center"><span class="mini-pct g" id="mpReal">—</span></div>
          </div>
          <div class="mini-label">خبر حقيقي</div>
          <div class="mini-code g">REAL</div>
        </div>
        <div class="mini-ring-item">
          <div class="mini-ring-wrap">
            <svg viewBox="0 0 110 110"><circle class="mini-ring-bg" cx="55" cy="55" r="44"/><circle class="mini-ring-fill r" cx="55" cy="55" r="44" id="mfFake" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
            <div class="mini-center"><span class="mini-pct r" id="mpFake">—</span></div>
          </div>
          <div class="mini-label">خبر مزيف</div>
          <div class="mini-code r">FAKE</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-lbl">احتمال حقيقي</div>
          <div class="stat-val" id="sReal" style="color:var(--green)"></div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">احتمال مزيف</div>
          <div class="stat-val" id="sFake" style="color:var(--red)"></div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">عدد الكلمات</div>
          <div class="stat-val" id="sWords"></div>
        </div>
      </div>

      <div class="danger-row">
        <div class="danger-label-wrap">
          <div class="danger-key">مستوى الخطورة</div>
          <div class="danger-val" id="dangerVal"></div>
        </div>
        <div class="danger-arc">
          <svg width="210" height="110" viewBox="0 0 210 110">
            <path d="M36,65 A78,78 0 0 1 164,65" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="10" stroke-linecap="round"/>
            <path id="dangerArcFill" d="M36,65 A78,78 0 0 1 164,65"
              fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="163" stroke-dashoffset="163"
              style="transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)"/>
            <line x1="36"  y1="65" x2="47"  y2="71" stroke="var(--t3)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="64"  y1="37" x2="70"  y2="48" stroke="var(--t3)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="100" y1="28" x2="100" y2="40" stroke="var(--t3)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="136" y1="37" x2="130" y2="48" stroke="var(--t3)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="164" y1="65" x2="153" y2="71" stroke="var(--t3)" stroke-width="1.5" stroke-linecap="round"/>
            <text x="22"  y="62" fill="var(--t3)" font-size="10" font-family="monospace" text-anchor="middle">1</text>
            <text x="54"  y="28" fill="var(--t3)" font-size="10" font-family="monospace" text-anchor="middle">2</text>
            <text x="100" y="16" fill="var(--t3)" font-size="10" font-family="monospace" text-anchor="middle">3</text>
            <text x="146" y="28" fill="var(--t3)" font-size="10" font-family="monospace" text-anchor="middle">4</text>
            <text x="178" y="62" fill="var(--t3)" font-size="10" font-family="monospace" text-anchor="middle">5</text>
          </svg>
        </div>
      </div>

      <div class="explain-box">
        <div class="sec-label">شرح النتيجة</div>
        <p class="explain-txt" id="explainTxt"></p>
      </div>
    </div>
  </div>
</main>

<script>
var mode = 'text';
var API_BASE = 'http://localhost:5000';

function pick(m) {
  mode = m;
  document.getElementById('tabTxt').classList.toggle('active', m==='text');
  document.getElementById('tabUrl').classList.toggle('active', m==='url');
  document.getElementById('secTxt').classList.toggle('show', m==='text');
  document.getElementById('secUrl').classList.toggle('show', m==='url');
  clearResult(); clearErrors();
}

function wc() {
  var v = document.getElementById('txtIn').value.trim();
  var n = v ? v.split(/\s+/).filter(Boolean).length : 0;
  document.getElementById('wcMeta').textContent = n + ' كلمة';
}

function validate() {
  clearErrors();
  if (mode==='text') {
    var txt = document.getElementById('txtIn').value.trim();
    if (!txt) { showErr('errTxt','errTxtMsg','يرجاء إدخال نص الخبر أولاً.'); return false; }
    if (txt.split(/\s+/).filter(Boolean).length < 5) { showErr('errTxt','errTxtMsg','النص قصير جداً. الحد الأدنى 5 كلمات.'); return false; }
  } else {
    var url = document.getElementById('urlIn').value.trim();
    if (!url) { showErr('errUrl','errUrlMsg','يرجاء إدخال رابط المقال.'); return false; }
    if (!/^https?:\/\/.+\..+/.test(url)) { showErr('errUrl','errUrlMsg','يرجاء إدخال رابط صحيح يبدأ بـ https://'); return false; }
  }
  return true;
}
function showErr(b,m,msg){ document.getElementById(b).classList.add('show'); document.getElementById(m).textContent=msg; }
function clearErrors(){ document.getElementById('errTxt').classList.remove('show'); document.getElementById('errUrl').classList.remove('show'); }

function setLoading(on) {
  document.getElementById('loader').classList.toggle('show', on);
  document.getElementById('progbar').classList.toggle('show', on);
  document.querySelectorAll('.btn').forEach(function(b){ b.disabled=on; });
}

async function run(type) {
  if (!validate()) return;
  clearResult(); setLoading(true);
  try {
    var endpoint = API_BASE + (mode==='text' ? '/api/predict/text' : '/api/predict/url');
    var payload  = mode==='text'
      ? {body: document.getElementById('txtIn').value.trim()}
      : {url:  document.getElementById('urlIn').value.trim()};
    var res = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    var raw = await res.json();
    if (raw.error) {
      showErr(mode==='text'?'errTxt':'errUrl', mode==='text'?'errTxtMsg':'errUrlMsg', raw.error);
      setLoading(false); return;
    }
    setLoading(false);
    render(mapResp(raw), type);
  } catch(e) {
    showErr(mode==='text'?'errTxt':'errUrl', mode==='text'?'errTxtMsg':'errUrlMsg',
      'تعذّر الاتصال بالخادم. تأكد من تشغيل Flask على ' + API_BASE);
    setLoading(false);
  }
}

function mapResp(raw) {
  var pred  = raw.label;
  var conf  = Math.round(raw.confidence * 100);
  var pReal = Math.round(raw.prob_real * 100);
  var pFake = Math.round(raw.prob_fake * 100);
  var labels   = {real:'خبر حقيقي', fake:'خبر مزيف'};
  var tags     = {real:'REAL · حقيقي', fake:'FAKE · مزيف'};
  var subs     = {
    real: 'المحتوى يبدو موثوقاً وفق التحليل',
    fake: 'يحتوي على مؤشرات تضليل واضحة'
  };
  var explains = {
    real: 'النص يحتوي على مؤشرات لغوية تتسق مع الأخبار الموثوقة: أسلوب موضوعي، معلومات قابلة للتحقق، وخلو من العبارات التحريضية.',
    fake: 'رصد النموذج أنماطاً لغوية مرتبطة بالتضليل: مبالغة في الوصف، غياب المصادر الموثوقة، وعبارات عاطفية مثيرة. يُنصح بالتحقق قبل المشاركة.'
  };
  return {
    pred, conf, pReal, pFake,
    wds:     raw.word_count,
    danger:  {lbl: raw.danger_lbl, steps: raw.danger_steps},
    label:   labels[pred]   || pred,
    tag:     tags[pred]     || pred,
    sub:     subs[pred]     || '',
    explain: explains[pred] || ''
  };
}

function render(d, type) {
  var rcard = document.getElementById('rcard');
  rcard.className = 'rcard ' + d.pred;

  var fill  = document.getElementById('ringFill');
  var circ  = 452.4;   // 2π×72
  fill.style.transition       = 'none';
  fill.style.strokeDashoffset = circ;

  document.getElementById('ringPct').textContent    = d.conf + '%';
  document.getElementById('verdictTag').textContent  = d.tag;
  document.getElementById('verdictMain').textContent = d.label;
  document.getElementById('verdictSub').textContent  = d.sub;

  setTimeout(function(){
    fill.style.transition       = 'stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)';
    fill.style.strokeDashoffset = circ - (d.conf / 100) * circ;
  }, 80);

  var dw = document.getElementById('detWrap');
  if (type === 'detail') {
    dw.style.display = 'flex';
    var mcirc = 276.5;  // 2π×44

    ['mfReal','mfFake'].forEach(function(id){
      var el = document.getElementById(id);
      el.style.transition       = 'none';
      el.style.strokeDashoffset = mcirc;
    });

    document.getElementById('mpReal').textContent = d.pReal + '%';
    document.getElementById('mpFake').textContent = d.pFake + '%';

    setTimeout(function(){
      ['mfReal','mfFake'].forEach(function(id){
        document.getElementById(id).style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)';
      });
      document.getElementById('mfReal').style.strokeDashoffset = mcirc - (d.pReal/100)*mcirc;
      document.getElementById('mfFake').style.strokeDashoffset = mcirc - (d.pFake/100)*mcirc;
    }, 120);

    document.getElementById('sReal').textContent  = d.pReal + '%';
    document.getElementById('sFake').textContent  = d.pFake + '%';
    document.getElementById('sWords').textContent = d.wds;

    var arc      = document.getElementById('dangerArcFill');
    var dCls     = d.danger.steps <= 2 ? 'lo' : d.danger.steps === 3 ? 'me' : 'hi';
    var arcColors= {lo:'var(--green)', me:'var(--amber)', hi:'var(--red)'};
    arc.setAttribute('stroke', arcColors[dCls] || 'var(--green)');
    arc.style.transition = 'none';
    arc.style.strokeDashoffset = 163;
    document.getElementById('dangerVal').textContent = d.danger.lbl;
    setTimeout(function(){
      arc.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)';
      arc.style.strokeDashoffset = 163 * (1 - d.danger.steps / 5);
    }, 150);

    document.getElementById('explainTxt').textContent = d.explain;
  } else {
    dw.style.display = 'none';
  }

  var el = document.getElementById('results');
  el.classList.add('show');
  el.scrollIntoView({behavior:'smooth', block:'start'});
}

function clearResult(){ document.getElementById('results').classList.remove('show'); }
function doReset(){
  clearResult(); clearErrors();
  document.getElementById('txtIn').value = '';
  document.getElementById('urlIn').value = '';
  wc();
}
</script>
